name: macOS
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build the DMG (compiles VoxType with Metal; about 20 minutes)
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: python3 -m unittest discover -s tests -v
  bundle:
    # DMG: manual runs when asked, and every v* tag. Models are not bundled (the app downloads
    # them on first start), so the DMG is small and a tag publishes it directly as a pre-release.
    if: (github.event_name == 'workflow_dispatch' && inputs.bundle) || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install cmake
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: '[[ "${GITHUB_REF_NAME}" == "v$(tr -d "[:space:]" < VERSION)" ]] || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION"; exit 1; }'
      # Ad-hoc signed unless SIGNING_IDENTITY/NOTARY_PROFILE are configured on the runner.
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BellowFlow-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          DMG=$(ls BellowFlow-*-macOS-arm64.dmg)
          cat > notes.md <<EOF
          Unsigned development build (ad-hoc signature). Apple Silicon, macOS 13+, 16 GB RAM minimum.

          Easiest install (downloads, verifies, and installs the app):

              curl -fsSL https://xuancongwen.github.io/bellowflow/install.sh | bash

          Or download \`$DMG\`, open it, drag BellowFlow to Applications, and right-click → Open the first time (Gatekeeper). Verify with \`shasum -a 256 -c $DMG.sha256\`.

          On first start the app downloads the speech and cleanup models (about 5.3 GB, once) into Application Support.
          EOF
          gh release create "$GITHUB_REF_NAME" --prerelease --title "BellowFlow $GITHUB_REF_NAME" --notes-file notes.md "$DMG" "$DMG.sha256"
