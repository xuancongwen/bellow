name: Pages
# Publishes site/ plus scripts/install.sh to https://xuancongwen.github.io/bellowflow/.
# configure-pages enables Pages (source: GitHub Actions) on first run; if that is refused,
# set it once by hand: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: bash -n scripts/install.sh
      - run: mkdir -p _site && cp -R site/. _site/ && cp scripts/install.sh _site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
